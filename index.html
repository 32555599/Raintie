<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记雨 · Raintie</title>
<style>
  :root {
    --bg: #FAFAFA;
    --text: #1A1A1A;
    --sub: #8A8A8A;
    --primary: #1A1A1A;
    --divider: #EEEEEE;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 24px 48px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon {
    width: 108px;
    height: 108px;
    border-radius: 26px;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(0,0,0,0.10);
  }
  h1 {
    margin: 26px 0 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 6px;
    text-align: center;
    padding-left: 6px;
  }
  .sub {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--sub);
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
  }
  .divider {
    width: 36px;
    height: 2px;
    background: var(--divider);
    margin: 30px 0;
    border-radius: 1px;
  }
  .intro {
    font-size: 15px;
    line-height: 1.95;
    text-align: center;
    color: var(--text);
    margin: 0;
    max-width: 340px;
  }
  .points {
    margin: 30px 0 0;
    padding: 0;
    list-style: none;
    width: 100%;
    max-width: 340px;
  }
  .points li {
    font-size: 13px;
    color: var(--sub);
    padding: 5px 0;
    text-align: center;
    letter-spacing: 0.6px;
  }
  .points li::before {
    content: "·";
    margin-right: 8px;
    color: var(--sub);
  }
  .btn {
    display: block;
    width: 100%;
    max-width: 340px;
    margin: 44px 0 0;
    padding: 17px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }
  .link {
    display: block;
    margin: 18px 0 0;
    color: var(--sub);
    font-size: 13px;
    text-decoration: none;
    letter-spacing: 0.6px;
    padding: 6px 12px;
  }
  .link:active { opacity: 0.6; }
  .foot {
    margin-top: auto;
    padding-top: 56px;
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 1.5px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">

    <img class="icon"
         src="https://avatars.githubusercontent.com/u/153488973?v=4"
         alt="记雨图标">

    <h1>记雨</h1>
    <p class="sub">Raintie</p>

    <div class="divider"></div>

    <p class="intro">
      一个离线、私密的 Android 人际档案本。<br>
      以人为中心，记录重要的人、照片、故事与关系变化。
    </p>

    <ul class="points">
      <li>不联网 · 不注册 · 不追踪</li>
      <li>数据只存本地</li>
      <li>用时间去记录，用记录去留住</li>
    </ul>

    <a class="btn"
       href="https://raw.githubusercontent.com/32555599/Raintie/refs/heads/main/%E8%AE%B0%E9%9B%A8_1.4.apk"
       download>
      下载 APK · v1.4
    </a>

    <a class="link"
       href="https://github.com/32555599/Raintie"
       target="_blank" rel="noopener">
      查看 GitHub 项目 →
    </a>

    <p class="foot">记雨 · Raintie</p>

  </div>
</body>
</html>
